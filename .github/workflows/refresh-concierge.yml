name: Refresh concierge details

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/refresh-concierge.mjs
      - run: |
          git config user.name "Williams Cottage Concierge"
          git config user.email "actions@github.com"
          git add daily-concierge.json
          git diff --cached --quiet || git commit -m "Refresh daily concierge details"
          git push
